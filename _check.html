<!doctype html><meta charset="utf-8"><title>check</title>
<body style="margin:0;font:13px monospace;background:#111;color:#0f0">
<pre id="out">running…</pre>
<script>
const widths = [320, 360, 390, 414];
const out = document.getElementById('out');
const lines = [];
let i = 0;
function overflowPass() {
  if (i >= widths.length) { domChecks(); return; }
  const w = widths[i];
  const f = document.createElement('iframe');
  f.style.cssText = `width:${w}px;height:600px;border:0;position:absolute;left:-9999px`;
  f.src = '/';
  f.onload = () => {
    const d = f.contentDocument, sw = d.documentElement.scrollWidth, cw = f.contentWindow.innerWidth;
    lines.push(`overflow @${w}px  scrollW=${sw} innerW=${cw}  ${sw-cw>1?'OVERFLOW +'+(sw-cw):'ok'}`);
    f.remove(); i++; setTimeout(overflowPass, 200);
  };
  document.body.appendChild(f);
}
function domChecks() {
  const f = document.createElement('iframe');
  f.style.cssText = 'width:1200px;height:800px;border:0;position:absolute;left:-9999px';
  f.src = '/';
  f.onload = () => setTimeout(() => {
    const d = f.contentDocument, w = f.contentWindow;
    const bars = d.querySelectorAll('.lang__bar i').length;
    const gh = d.querySelectorAll('a[href*="github.com/mariamthabett"]').length;
    const prev = !!d.getElementById('lightboxPrev'), next = !!d.getElementById('lightboxNext');
    const themeBtn = !!d.getElementById('themeToggle');
    const shot = d.querySelector('.project__gallery [data-lightbox]');
    let lb = 'no-shot';
    if (shot) {
      shot.click();
      const img = d.getElementById('lightboxImg');
      const first = img.getAttribute('src');
      d.getElementById('lightboxNext').click();
      const second = img.getAttribute('src');
      const open = d.getElementById('lightbox').classList.contains('open');
      lb = `open=${open} advanced=${first!==second} (${first?first.split('/').pop():'-'} -> ${second?second.split('/').pop():'-'})`;
      d.getElementById('lightboxClose').click();
    }
    const before = d.documentElement.getAttribute('data-theme');
    if (themeBtn) d.getElementById('themeToggle').click();
    const after = d.documentElement.getAttribute('data-theme');
    lines.push(`skillbars(.lang__bar i)=${bars} (expect 7)`);
    lines.push(`githubLinks=${gh} (expect 2)`);
    lines.push(`lightbox prev/next present=${prev}/${next}`);
    lines.push(`lightbox test: ${lb}`);
    lines.push(`themeToggle flips: ${before} -> ${after}`);
    out.textContent = 'DONE\n' + lines.join('\n');
  }, 400);
  document.body.appendChild(f);
}
overflowPass();
</script>
