<!doctype html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="/" style="width:1280px;height:820px;border:0;display:block"></iframe>
<script>
  var f = document.getElementById('f');
  f.onload = function () {
    setTimeout(function () {
      var w = f.contentWindow, d = f.contentDocument;
      var exp = d.getElementById('experience');
      if (exp) w.scrollTo(0, exp.offsetTop - 20);
    }, 700);
  };
</script>
